name: Publish approved landing
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PUBLISH to confirm rights and privacy review'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - name: Verify publication approval
        env:
          APPROVED: ${{ vars.PUBLIC_RELEASE_APPROVED }}
          CONFIRMATION: ${{ inputs.confirm }}
        run: |
          if [[ "$GITHUB_REF" != 'refs/heads/main' || "$APPROVED" != 'true' || "$CONFIRMATION" != 'PUBLISH' ]]; then
            echo '::error::Use main, set PUBLIC_RELEASE_APPROVED=true only after rights/privacy review, and type PUBLISH.'
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/privacy_check.py && python scripts/validate.py && python -m unittest discover -s tests && python scripts/build.py && python scripts/privacy_check.py --generated
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/start/
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy approved landing
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
