name: Release packages
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    if: vars.PUBLIC_RELEASE_APPROVED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - run: python scripts/privacy_check.py && python scripts/validate.py && python -m unittest discover -s tests && python scripts/build.py && python scripts/privacy_check.py --generated
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/English_Immersion_Empezar_*.zip --verify-tag --generate-notes "${args[@]}"
