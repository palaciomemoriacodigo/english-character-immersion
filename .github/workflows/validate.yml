name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python scripts/privacy_check.py
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests
      - run: python scripts/build.py
      - run: python scripts/privacy_check.py --generated
      - name: Save landing preview (public repository)
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: landing-preview
          path: dist/start/
          if-no-files-found: error
          retention-days: 3
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.51.0
          python -m playwright install --with-deps chromium
      - name: Test landing in Chromium
        run: python tests/browser_landing.py
      - name: Save browser screenshots
        if: always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: landing-browser-review
          path: dist/browser-review/
          if-no-files-found: ignore
          retention-days: 3
